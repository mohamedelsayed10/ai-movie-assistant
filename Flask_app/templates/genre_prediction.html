<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Genre Prediction - Movie AI</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 600;
        }

        .back-btn {
            padding: 10px 20px;
            background: white;
            color: #667eea;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s;
        }

        .back-btn:hover {
            transform: scale(1.05);
        }

        .content {
            padding: 40px;
        }

        .input-section {
            margin-bottom: 30px;
        }

        .input-section h2 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 20px;
        }

        textarea {
            width: 100%;
            min-height: 200px;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 14px;
            font-family: inherit;
            resize: vertical;
            outline: none;
            transition: border 0.3s;
        }

        textarea:focus {
            border-color: #667eea;
        }

        .char-count {
            text-align: right;
            color: #999;
            font-size: 12px;
            margin-top: 5px;
        }

        .example-btn {
            padding: 8px 16px;
            background: #f0f0f0;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            font-size: 12px;
            margin-top: 10px;
            transition: all 0.3s;
        }

        .example-btn:hover {
            background: #e0e0e0;
        }

        .predict-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .predict-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .predict-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
            color: #667eea;
            font-weight: 600;
        }

        .loading-spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .results {
            display: none;
            margin-top: 30px;
            padding: 25px;
            background: #f5f5f5;
            border-radius: 10px;
        }

        .results h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 22px;
        }

        .genre-item {
            background: white;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .genre-name {
            font-weight: 600;
            color: #333;
            font-size: 16px;
        }

        .genre-confidence {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .confidence-bar {
            width: 150px;
            height: 8px;
            background: #e0e0e0;
            border-radius: 4px;
            overflow: hidden;
        }

        .confidence-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            transition: width 0.5s;
        }

        .confidence-text {
            font-weight: 600;
            color: #667eea;
            min-width: 50px;
        }

        .confidence-level {
            font-size: 12px;
            color: #999;
        }

        .error {
            display: none;
            padding: 15px;
            background: #ffebee;
            border-left: 4px solid #f44336;
            border-radius: 5px;
            color: #c62828;
            margin-top: 15px;
        }

        .predicted-genres {
            margin-bottom: 20px;
            padding: 15px;
            background: white;
            border-radius: 8px;
        }

        .predicted-genres h3 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 18px;
        }

        .genre-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .genre-tag {
            padding: 6px 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 15px;
            font-size: 14px;
            font-weight: 600;
        }

        @media (max-width: 768px) {
            .content {
                padding: 20px;
            }

            .confidence-bar {
                width: 100px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎭 Genre Prediction</h1>
            <a href="/" class="back-btn">← Home</a>
        </div>

        <div class="content">
            <div class="input-section">
                <h2>Enter Movie Plot</h2>
                <textarea id="plotInput" placeholder="Paste or type a movie plot here... (minimum 20 characters)"></textarea>
                <div class="char-count">
                    <span id="charCount">0</span> characters
                </div>
                <button class="example-btn" onclick="loadExample()">Load Example Plot</button>
            </div>

            <button class="predict-btn" onclick="predictGenres()">🔮 Predict Genres</button>

            <div class="loading" id="loading">
                <div class="loading-spinner"></div>
                <p>Analyzing plot with AI...</p>
            </div>

            <div class="error" id="error"></div>

            <div class="results" id="results">
                <div class="predicted-genres" id="predictedGenres">
                    <h3>Predicted Genres (Above Threshold)</h3>
                    <div class="genre-tags" id="genreTags"></div>
                </div>

                <h2>Top 5 Genres by Confidence</h2>
                <div id="genreList"></div>
            </div>
        </div>
    </div>

    <script>
        const plotInput = document.getElementById('plotInput');
        const charCount = document.getElementById('charCount');
        const loading = document.getElementById('loading');
        const error = document.getElementById('error');
        const results = document.getElementById('results');
        const genreList = document.getElementById('genreList');
        const genreTags = document.getElementById('genreTags');

        // Update character count
        plotInput.addEventListener('input', () => {
            charCount.textContent = plotInput.value.length;
        });

        // Load example plot
        function loadExample() {
            const example = `A young wizard discovers he has magical powers and is invited to attend a prestigious school of witchcraft and wizardry. There, he makes lifelong friends and learns about his mysterious past. Together, they must face dark forces that threaten both the magical and non-magical worlds. As he grows older, the wizard uncovers secrets about his family and destiny, leading to an epic confrontation with the most powerful dark wizard of all time.`;
            plotInput.value = example;
            charCount.textContent = example.length;
        }

        // Predict genres
        async function predictGenres() {
            const plot = plotInput.value.trim();

            // Validation
            if (plot.length < 20) {
                showError('Please enter at least 20 characters');
                return;
            }

            // Show loading
            loading.style.display = 'block';
            error.style.display = 'none';
            results.style.display = 'none';

            try {
                const response = await fetch('/api/predict-genre', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ plot })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Prediction failed');
                }

                displayResults(data);
            } catch (err) {
                showError(err.message);
            } finally {
                loading.style.display = 'none';
            }
        }

        // Display results
        function displayResults(data) {
            // Show predicted genres (above threshold)
            if (data.genres.length > 0) {
                genreTags.innerHTML = data.genres.map(genre => 
                    `<span class="genre-tag">${genre}</span>`
                ).join('');
            } else {
                genreTags.innerHTML = '<span style="color: #999;">No genres above confidence threshold</span>';
            }

            // Show top 5 genres with confidence bars
            genreList.innerHTML = data.top_genres.map(item => `
                <div class="genre-item">
                    <div>
                        <div class="genre-name">${item.genre}</div>
                        <div class="confidence-level">${item.confidence}</div>
                    </div>
                    <div class="genre-confidence">
                        <div class="confidence-bar">
                            <div class="confidence-fill" style="width: ${item.probability * 100}%"></div>
                        </div>
                        <span class="confidence-text">${(item.probability * 100).toFixed(1)}%</span>
                    </div>
                </div>
            `).join('');

            results.style.display = 'block';
            results.scrollIntoView({ behavior: 'smooth' });
        }

        // Show error
        function showError(message) {
            error.textContent = message;
            error.style.display = 'block';
        }

        // Allow Enter key to submit (with Shift for new line)
        plotInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                predictGenres();
            }
        });
    </script>
</body>
</html>
