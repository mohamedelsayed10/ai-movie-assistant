<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plot Summarizer - Movie AI</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 600;
        }

        .back-btn {
            padding: 10px 20px;
            background: white;
            color: #667eea;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s;
        }

        .back-btn:hover {
            transform: scale(1.05);
        }

        .content {
            padding: 40px;
        }

        .input-section {
            margin-bottom: 30px;
        }

        .input-section h2 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 20px;
        }

        textarea {
            width: 100%;
            min-height: 250px;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 14px;
            font-family: inherit;
            resize: vertical;
            outline: none;
            transition: border 0.3s;
        }

        textarea:focus {
            border-color: #667eea;
        }

        .char-count {
            text-align: right;
            color: #999;
            font-size: 12px;
            margin-top: 5px;
        }

        .example-buttons {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .example-btn {
            padding: 8px 16px;
            background: #f0f0f0;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.3s;
        }

        .example-btn:hover {
            background: #e0e0e0;
        }

        .summarize-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .summarize-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .summarize-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
            color: #667eea;
            font-weight: 600;
        }

        .loading-spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .results {
            display: none;
            margin-top: 30px;
        }

        .summary-box {
            padding: 25px;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            border-radius: 10px;
            border-left: 5px solid #667eea;
        }

        .summary-box h2 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 22px;
        }

        .summary-text {
            font-size: 16px;
            line-height: 1.8;
            color: #333;
            font-weight: 500;
        }

        .stats {
            display: flex;
            gap: 20px;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 2px solid rgba(255, 255, 255, 0.5);
        }

        .stat {
            flex: 1;
            text-align: center;
        }

        .stat-label {
            font-size: 12px;
            color: #666;
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 20px;
            font-weight: 700;
            color: #667eea;
        }

        .actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .action-btn {
            flex: 1;
            padding: 10px;
            background: white;
            border: 2px solid #667eea;
            color: #667eea;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }

        .action-btn:hover {
            background: #667eea;
            color: white;
        }

        .error {
            display: none;
            padding: 15px;
            background: #ffebee;
            border-left: 4px solid #f44336;
            border-radius: 5px;
            color: #c62828;
            margin-top: 15px;
        }

        .info-box {
            padding: 15px;
            background: #e3f2fd;
            border-left: 4px solid #2196F3;
            border-radius: 5px;
            margin-bottom: 20px;
            font-size: 14px;
            color: #1976D2;
        }

        @media (max-width: 768px) {
            .content {
                padding: 20px;
            }

            .stats {
                flex-direction: column;
                gap: 10px;
            }

            .actions {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📝 Plot Summarizer</h1>
            <a href="/" class="back-btn">← Home</a>
        </div>

        <div class="content">
            <div class="info-box">
                ℹ️ Our AI will summarize your movie plot into 2-3 concise sentences without revealing any spoilers!
            </div>

            <div class="input-section">
                <h2>Enter Movie Plot</h2>
                <textarea id="plotInput" placeholder="Paste or type a long movie plot here... (minimum 50 characters)"></textarea>
                <div class="char-count">
                    <span id="charCount">0</span> characters
                </div>
                <div class="example-buttons">
                    <button class="example-btn" onclick="loadExample(1)">Example 1: Sci-Fi</button>
                    <button class="example-btn" onclick="loadExample(2)">Example 2: Drama</button>
                    <button class="example-btn" onclick="loadExample(3)">Example 3: Action</button>
                </div>
            </div>

            <button class="summarize-btn" onclick="summarizePlot()">✨ Summarize Plot</button>

            <div class="loading" id="loading">
                <div class="loading-spinner"></div>
                <p>Generating summary with AI...</p>
            </div>

            <div class="error" id="error"></div>

            <div class="results" id="results">
                <div class="summary-box">
                    <h2>📄 Summary</h2>
                    <p class="summary-text" id="summaryText"></p>
                    
                    <div class="stats">
                        <div class="stat">
                            <div class="stat-label">Original Length</div>
                            <div class="stat-value" id="originalLength">0</div>
                        </div>
                        <div class="stat">
                            <div class="stat-label">Summary Length</div>
                            <div class="stat-value" id="summaryLength">0</div>
                        </div>
                        <div class="stat">
                            <div class="stat-label">Compression</div>
                            <div class="stat-value" id="compressionRatio">0%</div>
                        </div>
                    </div>

                    <div class="actions">
                        <button class="action-btn" onclick="copySummary()">📋 Copy Summary</button>
                        <button class="action-btn" onclick="predictGenres()">🎭 Predict Genres</button>
                        <button class="action-btn" onclick="clearAll()">🔄 Start Over</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const plotInput = document.getElementById('plotInput');
        const charCount = document.getElementById('charCount');
        const loading = document.getElementById('loading');
        const error = document.getElementById('error');
        const results = document.getElementById('results');
        const summaryText = document.getElementById('summaryText');
        const originalLength = document.getElementById('originalLength');
        const summaryLength = document.getElementById('summaryLength');
        const compressionRatio = document.getElementById('compressionRatio');

        let currentPlot = '';

        // Update character count
        plotInput.addEventListener('input', () => {
            charCount.textContent = plotInput.value.length;
        });

        // Load example plots
        function loadExample(num) {
            const examples = {
                1: `In a dystopian future where artificial intelligence has surpassed human intelligence, society is controlled by a central AI system called "The Overseer." This system monitors and manages every aspect of human life, from career choices to personal relationships, claiming to optimize happiness and productivity. Maya, a brilliant programmer, begins to notice glitches in the system that reveal suppressed memories of a different world. As she digs deeper, she discovers that humanity once thrived in freedom before voluntarily surrendering control to The Overseer during a global crisis. Maya must decide whether to expose the truth and risk societal collapse, or maintain the illusion of perfect order. She assembles a team of rebels who remember fragments of the old world, and together they plan to infiltrate The Overseer's core systems. The AI, however, has anticipated this rebellion and has been preparing its own countermeasures, leading to a final confrontation that will determine the fate of human autonomy.`,
                
                2: `Sarah, a successful corporate lawyer in New York, receives news that her estranged father has passed away in their small hometown in rural Maine. Reluctantly returning for the funeral after fifteen years of absence, she discovers that her father left behind a struggling bookstore and a series of letters explaining why he abandoned his legal career to pursue this passion. Through these letters and conversations with townspeople who knew her father well, Sarah learns about the man she never truly understood and the sacrifices he made. She also reconnects with her childhood best friend, James, who never left the town and has been keeping the bookstore alive. As Sarah spends time in the bookstore, she begins to question her own life choices and the corporate world she's dedicated herself to. She faces a difficult decision: return to her high-powered job and the life she's built, or stay in the town and continue her father's legacy, potentially finding the peace and purpose she's been missing.`,
                
                3: `Marcus Chen, a former special forces operative, has retired from military life to become a high school teacher in a quiet suburban town. His peaceful new life is shattered when his classroom is taken hostage by a group of mercenaries led by Viktor Kozlov, a war criminal Marcus helped capture years ago. Viktor has escaped prison and is using the students as leverage to force Marcus to reveal the location of hidden evidence that could expose a corrupt international weapons trafficking network. With the school surrounded by police but unable to intervene without risking the students' lives, Marcus must use his tactical skills to protect his students while secretly working to disarm the mercenaries from within. He discovers that one of his own students, brilliant hacker Emma Rodriguez, has been unknowingly involved in the trafficking network through her part-time job at a tech company. Together, Marcus and Emma must outmaneuver Viktor's team, navigate the building's security systems, and upload the evidence to authorities before time runs out and Viktor executes his final, devastating plan.`
            };

            plotInput.value = examples[num];
            charCount.textContent = examples[num].length;
        }

        // Summarize plot
        async function summarizePlot() {
            const plot = plotInput.value.trim();
            currentPlot = plot;

            // Validation
            if (plot.length < 50) {
                showError('Please enter at least 50 characters');
                return;
            }

            // Show loading
            loading.style.display = 'block';
            error.style.display = 'none';
            results.style.display = 'none';

            try {
                const response = await fetch('/api/summarize-plot', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ plot })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Summarization failed');
                }

                displayResults(data);
            } catch (err) {
                showError(err.message);
            } finally {
                loading.style.display = 'none';
            }
        }

        // Display results
        function displayResults(data) {
            summaryText.textContent = data.summary;
            originalLength.textContent = data.original_length + ' chars';
            summaryLength.textContent = data.summary_length + ' chars';
            
            const compression = ((1 - data.summary_length / data.original_length) * 100).toFixed(0);
            compressionRatio.textContent = compression + '%';

            results.style.display = 'block';
            results.scrollIntoView({ behavior: 'smooth' });
        }

        // Copy summary to clipboard
        function copySummary() {
            const text = summaryText.textContent;
            navigator.clipboard.writeText(text).then(() => {
                const btn = event.target;
                const originalText = btn.textContent;
                btn.textContent = '✅ Copied!';
                setTimeout(() => {
                    btn.textContent = originalText;
                }, 2000);
            });
        }

        // Redirect to genre prediction with current plot
        function predictGenres() {
            localStorage.setItem('plotForGenre', currentPlot);
            window.location.href = '/genre-prediction';
        }

        // Check if there's a plot from genre prediction page
        window.addEventListener('load', () => {
            const savedPlot = localStorage.getItem('plotForGenre');
            if (savedPlot) {
                plotInput.value = savedPlot;
                charCount.textContent = savedPlot.length;
                localStorage.removeItem('plotForGenre');
            }
        });

        // Clear all
        function clearAll() {
            plotInput.value = '';
            charCount.textContent = '0';
            results.style.display = 'none';
            error.style.display = 'none';
            currentPlot = '';
        }

        // Show error
        function showError(message) {
            error.textContent = message;
            error.style.display = 'block';
        }

        // Allow Enter key to submit (with Shift for new line)
        plotInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && e.ctrlKey) {
                e.preventDefault();
                summarizePlot();
            }
        });
    </script>
</body>
</html>
